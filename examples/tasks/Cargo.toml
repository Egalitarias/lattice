[package]
name = "tasks"
version = "0.1.0"
edition = "2021"
description = "Lattice reference app: a todo list whose state lives on the server, reached over typed RPC."

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
